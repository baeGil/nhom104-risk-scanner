[pytest]
testpaths = src
python_files = test_*.py
python_classes = Test
python_functions = test_*
markers =
    skip_if_no_neo4j: requires Neo4j connection
    skip_if_no_llm: requires OpenAI API key
    skip_if_no_embedding: requires embedding service
    live_neo4j: requires live Neo4j and retrieval indexes
    live_llm: requires live LLM API
    ocr: requires OCR dependencies or API
    slow: slow integration or end-to-end test
    e2e: end-to-end workflow test
asyncio_mode = auto
addopts = -v
